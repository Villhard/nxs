  <title id="nxs-bug-dark-title">dev-bug: the cause class decides the outcome</title>
  <desc id="nxs-bug-dark-desc">dev-bug reproduces the symptom, finds the root cause and checks it against the glossary, decision records and specs; right, silent and wrong give a fix ticket for /plan, feature hands off to /dev-rnd.</desc>

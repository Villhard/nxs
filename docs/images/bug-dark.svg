<title id="nxs-bug-dark-title">Diagnosis and possible next steps</title>
<desc id="nxs-bug-dark-desc">A confirmed cause is classified as right, silent, wrong or feature. Silent and wrong require agreement before ticket eligibility; feature returns to discussion. Unconfirmed causes need evidence.</desc>

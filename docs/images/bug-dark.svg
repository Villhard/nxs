<text x="32" y="39" fill="#dadada" font-family="system-ui,sans-serif" font-size="22" font-weight="650">Diagnosis and possible next steps</text>
<text x="32" y="63" fill="#909090" font-family="system-ui,sans-serif" font-size="12">Diagnosis saves evidence; a later ticket step is separately authorized.</text>

  <title id="nxs-ticket-status-dark-title">Ticket statuses and separate lead acceptance</title>
  <desc id="nxs-ticket-status-dark-desc">Standalone ticket setters and human round trips remain unchanged; controlled done, needs_input and blocked outcomes are separate from ticket statuses, independent lead acceptance and verified commit checkpoints, and executors never commit.</desc>

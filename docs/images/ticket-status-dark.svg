  <rect x="600" y="160" width="272" height="56" rx="6" fill="#262626" stroke="#dadada" stroke-width="1"/>
  <rect x="608" y="166" width="42" height="12" rx="2" fill="transparent" stroke="#dadada" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="629" y="175" fill="#dadada" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATUS</text>
  <text x="736" y="190" fill="#dadada" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">ready-for-human</text>
  <text x="736" y="205" fill="#909090" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">executor: migration, dependency</text>
  <rect x="600" y="280" width="272" height="56" rx="6" fill="#1c1c1c"/>
  <rect x="600" y="280" width="272" height="56" rx="6" fill="#262626" stroke="#dadada" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="608" y="286" width="42" height="12" rx="2" fill="transparent" stroke="#dadada" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="629" y="295" fill="#dadada" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATUS</text>
  <text x="736" y="310" fill="#dadada" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">wontfix</text>
  <text x="736" y="325" fill="#909090" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">you; or a review ticket, no repro</text>
  <text x="32" y="368" fill="#909090" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">The executor stops while Status is not ready-for-agent or a blocker is not resolved; it never commits.</text>
  <text x="32" y="410" fill="#dadada" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">WITH A LEAD: STATUS, OUTCOME AND CHECKPOINT ARE DISTINCT</text>
  <text x="32" y="436" fill="#909090" font-size="12" font-family="'Geist', system-ui, sans-serif">resolved is a ticket status; independent lead acceptance and a verified commit checkpoint are separate.</text>
  <text x="32" y="460" fill="#909090" font-size="12" font-family="'Geist', system-ui, sans-serif">done / needs_input / blocked are bounded outcomes, not ticket statuses.</text>
  <text x="32" y="484" fill="#909090" font-size="12" font-family="'Geist', system-ui, sans-serif">Lead checks / review / fixes / dev-spec / atomic dev-commit precede the next independent ticket.</text>

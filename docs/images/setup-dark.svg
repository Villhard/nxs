<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="setup-dark-title setup-dark-desc">
<title id="setup-dark-title">Setup is independent, scoped and approved</title>
<desc id="setup-dark-desc">nxs-setup audits a goal, project or global target, proposes an exact package and applies only approved changes; project or global readiness reports relevant prerequisites without writes.</desc>
<defs><marker id="setup-dark-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#909090"/></marker></defs>
<style>text{font-family:'Geist',system-ui,sans-serif;fill:#dadada}.title{font-family:'Instrument Serif',Georgia,serif;font-size:28px}.name{font-size:16px;font-weight:600}.cmd{font-family:'Geist Mono',ui-monospace,monospace}.sub{font-size:13px;fill:#909090}.node{fill:#1c1c1c;stroke:#909090;stroke-width:1.2}.edge{fill:none;stroke:#909090;stroke-width:1.5;marker-end:url(#setup-dark-arrow)}</style>
<rect width="960" height="520" fill="#1c1c1c"/>
<text class="title" x="40" y="48">Setup supports work; it does not start the workflow</text>
<text class="sub" x="40" y="76">A narrow goal never implies a project/global change or an installation.</text>
<path class="edge" d="M264 216 H328"/>
<path class="edge" d="M488 216 H552"/>
<path class="edge" d="M728 216 H792"/>
<path class="edge" d="M488 392 H632"/>
<rect class="node" x="40" y="176" width="224" height="80" rx="6"/>
<text class="name cmd" x="60" y="208">nxs-setup</text><text class="sub" x="60" y="232">goal / project / global</text>
<rect class="node" x="328" y="176" width="160" height="80" rx="6"/>
<text class="name" x="348" y="208">Audit</text><text class="sub" x="348" y="232">Scope and sources.</text>
<rect class="node" x="552" y="176" width="176" height="80" rx="6"/>
<text class="name" x="572" y="208">Show package</text><text class="sub" x="572" y="232">Exact proposed diff.</text>
<rect class="node" x="792" y="176" width="128" height="80" rx="6"/>
<text class="name" x="808" y="208">Apply</text><text class="sub" x="808" y="232">Approved only.</text>
<text class="sub" x="40" y="296">Decline: no writes. Already current: report and stop. Preserve custom bytes, symlinks and settings.</text>
<rect class="node" x="40" y="352" width="448" height="80" rx="6"/>
<text class="name cmd" x="60" y="384">project --readiness / global --readiness</text><text class="sub" x="60" y="408">Separate report-only entry; no setup proposal or remediation.</text>
<rect class="node" x="632" y="352" width="288" height="80" rx="20"/>
<text class="name" x="652" y="384">Report and stop</text><text class="sub" x="652" y="408">Relevant prerequisites and evidence limits.</text>
<path d="M40 464 H920" stroke="#303030"/>
<text class="sub" x="40" y="492">No catalog installation or companion bundles. No worker/server launch just to report readiness.</text>
<text class="sub" x="40" y="512">Ordinary discussion and execution need no native-reviewer prerequisite.</text>
</svg>

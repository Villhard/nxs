  <title id="nxs-grill-light-title">Grill, then to-spec and to-tickets</title>
  <desc id="nxs-grill-light-desc">The interview settles decisions and writes the glossary, to-spec writes the spec in the same session, to-tickets slices it in the tracker format, /plan runs the tickets; /dev-rnd with a spec path is the alternative slicer.</desc>

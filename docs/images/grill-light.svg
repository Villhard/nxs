<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="nxs-grill-light-title nxs-grill-light-desc">
<title id="nxs-grill-light-title">From discussion to a feature spec</title>
<desc id="nxs-grill-light-desc">Discussion can end in dialogue. An approved decision or a clear request can be input to a separately authorized feature spec and eligible tickets.</desc>
<defs><marker id="nxs-grill-light-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#626262"/></marker></defs>
<rect width="960" height="500" fill="#eeeeee"/>
<text x="32" y="39" fill="#262626" font-family="system-ui,sans-serif" font-size="22" font-weight="650">From discussion to a feature spec</text>
<text x="32" y="63" fill="#626262" font-family="system-ui,sans-serif" font-size="12">Dashed links show possible paths; each operation needs its own applicable authorization.</text>
<path d="M232 140 H284" fill="none" stroke="#626262" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#nxs-grill-light-arrow)"/>
<path d="M232 170 H255 V260 H284" fill="none" stroke="#626262" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#nxs-grill-light-arrow)"/>
<path d="M474 260 H532" fill="none" stroke="#626262" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#nxs-grill-light-arrow)"/>
<path d="M712 256 H738 V205 H760" fill="none" stroke="#626262" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#nxs-grill-light-arrow)"/>
<path d="M712 144 H738 V184 H760" fill="none" stroke="#626262" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#nxs-grill-light-arrow)"/>
<path d="M844 250 V320" fill="none" stroke="#626262" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#nxs-grill-light-arrow)"/>
<rect x="32" y="115" width="200" height="82" rx="6" fill="#e4e4e4" stroke="#0061d2" stroke-width="1.2"/>
<text x="46" y="134" fill="#0061d2" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">COMMAND</text>
<text x="46" y="157" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">/rnd-grill</text>
<text x="46" y="176" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Discuss choices</text>
<text x="46" y="192" fill="#262626" font-family="system-ui,sans-serif" font-size="11">and evidence</text>
<rect x="284" y="90" width="190" height="78" rx="6" fill="#e4e4e4" stroke="#626262" stroke-width="1.2"/>
<text x="298" y="109" fill="#626262" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">OUTCOME</text>
<text x="298" y="132" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">Dialogue</text>
<text x="298" y="151" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Stop with shared understanding</text>
<rect x="284" y="215" width="190" height="90" rx="6" fill="#e4e4e4" stroke="#0061d2" stroke-width="1.2"/>
<text x="298" y="234" fill="#0061d2" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">COMMAND</text>
<text x="298" y="257" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">/to-decision</text>
<text x="298" y="276" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Show and save</text>
<text x="298" y="292" fill="#262626" font-family="system-ui,sans-serif" font-size="11">approved conclusions</text>
<rect x="532" y="215" width="180" height="82" rx="6" fill="#e4e4e4" stroke="#b73800" stroke-width="1.2"/>
<text x="546" y="234" fill="#b73800" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">RECORD</text>
<text x="546" y="257" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">Decision</text>
<text x="546" y="276" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Conclusions and open questions</text>
<rect x="532" y="105" width="180" height="78" rx="6" fill="#e4e4e4" stroke="#626262" stroke-width="1.2"/>
<text x="546" y="124" fill="#626262" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">INPUT</text>
<text x="546" y="147" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">Clear request</text>
<text x="546" y="166" fill="#262626" font-family="system-ui,sans-serif" font-size="11">No forced interview</text>
<rect x="760" y="160" width="168" height="90" rx="6" fill="#e4e4e4" stroke="#0061d2" stroke-width="1.2"/>
<text x="774" y="179" fill="#0061d2" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">COMMAND</text>
<text x="774" y="202" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">/to-spec</text>
<text x="774" y="221" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Feature spec from</text>
<text x="774" y="237" fill="#262626" font-family="system-ui,sans-serif" font-size="11">decision or request</text>
<rect x="760" y="320" width="168" height="82" rx="6" fill="#e4e4e4" stroke="#0061d2" stroke-width="1.2"/>
<text x="774" y="339" fill="#0061d2" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">COMMAND</text>
<text x="774" y="362" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">/to-tickets</text>
<text x="774" y="381" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Ready, approved spec;</text>
<text x="774" y="397" fill="#262626" font-family="system-ui,sans-serif" font-size="11">/plan ticket handoff</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" role="img" aria-labelledby="grill-light-title grill-light-desc">
<title id="grill-light-title">Discuss, optionally save, then choose</title>
<desc id="grill-light-desc">rnd-grill investigates a question and may finish in dialogue, save a useful approved record directly or suggest dev-exec for sufficient agreed scope without starting implementation.</desc>
<defs><marker id="grill-light-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#626262"/></marker></defs>
<style>text{font-family:'Geist',system-ui,sans-serif;fill:#262626}.title{font-family:'Instrument Serif',Georgia,serif;font-size:28px}.name{font-size:16px;font-weight:600}.cmd{font-family:'Geist Mono',ui-monospace,monospace}.sub{font-size:13px;fill:#626262}.node{fill:#eeeeee;stroke:#626262;stroke-width:1.2}.optional{stroke-dasharray:5 4}.edge{fill:none;stroke:#626262;stroke-width:1.5;marker-end:url(#grill-light-arrow)}</style>
<rect width="960" height="544" fill="#eeeeee"/>
<text class="title" x="40" y="48">A useful discussion needs no artifact chain</text>
<text class="sub" x="40" y="76">Evidence methods serve the actual question; they are not stages to complete.</text>
<path class="edge" d="M240 168 H320"/>
<path class="edge" d="M600 160 H696"/>
<path class="edge optional" d="M600 208 H640 Q648 208 648 216 V276 Q648 284 656 284 H696"/>
<path class="edge optional" d="M460 240 V368"/>
<rect class="node" x="40" y="128" width="200" height="80" rx="20"/>
<text class="name" x="60" y="160">Question or idea</text><text class="sub" x="60" y="184">What needs a decision?</text>
<rect class="node" x="320" y="128" width="280" height="112" rx="6"/>
<text class="name cmd" x="340" y="160">rnd-grill</text><text class="sub" x="340" y="184">Inspect evidence; compare choices.</text><text class="sub" x="340" y="204">Agree choices; keep unknowns explicit.</text><text class="sub" x="340" y="224">Experiment only in approved scope.</text>
<rect class="node" x="696" y="112" width="224" height="80" rx="20"/>
<text class="name" x="716" y="144">Finish in dialogue</text><text class="sub" x="716" y="168">No implied save or next step.</text>
<rect class="node optional" x="696" y="248" width="224" height="96" rx="6"/>
<text class="name" x="716" y="280">Direct approved save</text><text class="sub" x="716" y="304">Only the useful record.</text><text class="sub" x="716" y="324">Approve content and path.</text>
<rect class="node optional" x="320" y="368" width="280" height="80" rx="6"/>
<text class="name cmd" x="340" y="400">dev-exec</text><text class="sub" x="340" y="424">Agreed scope; approve the plan.</text>
<path d="M40 480 H920" stroke="#d7d7d7"/>
<text class="sub" x="40" y="508">Dashed: optional save or handoff. Agreement, a saved draft or prototype success authorizes no implementation.</text>
<text class="sub" x="40" y="532">Domain saves need their own approval; questionnaire preparation sends nothing; project specs belong to dev-spec.</text>
</svg>

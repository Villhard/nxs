<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="nxs-ticket-status-light-title nxs-ticket-status-light-desc">
<title id="nxs-ticket-status-light-title">Ticket status</title>
<desc id="nxs-ticket-status-light-desc">A status does not prove a prerequisite result or coordinator acceptance. Ready work may resolve or wait for a human; after the human step, recheck evidence. wontfix is set by the user or under the review-ticket exception.</desc>
<defs><marker id="nxs-ticket-status-light-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#626262"/></marker></defs>
<rect width="960" height="340" fill="#eeeeee"/>
<text x="32" y="42" fill="#262626" font-family="system-ui, sans-serif" font-size="22" font-weight="600">Ticket status</text>
<text x="32" y="68" fill="#626262" font-family="system-ui, sans-serif" font-size="14">A status does not prove a prerequisite result or coordinator acceptance</text>
<rect x="32" y="104" width="209" height="80" rx="6" fill="#e4e4e4" stroke="#0061d2"/>
<text x="44" y="134" fill="#262626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">needs-info</text>
<text x="44" y="158" fill="#626262" font-family="system-ui, sans-serif" font-size="12">clarification</text>
<rect x="261" y="104" width="209" height="80" rx="6" fill="#e4e4e4" stroke="#626262"/>
<text x="273" y="134" fill="#262626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">ready-for-agent</text>
<text x="273" y="158" fill="#626262" font-family="system-ui, sans-serif" font-size="12">check prerequisites</text>
<rect x="490" y="104" width="209" height="80" rx="6" fill="#e4e4e4" stroke="#626262"/>
<text x="502" y="134" fill="#262626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">ready-for-human</text>
<text x="502" y="158" fill="#626262" font-family="system-ui, sans-serif" font-size="12">human step</text>
<rect x="719" y="104" width="209" height="80" rx="6" fill="#e4e4e4" stroke="#626262"/>
<text x="731" y="134" fill="#262626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">resolved</text>
<text x="731" y="158" fill="#626262" font-family="system-ui, sans-serif" font-size="12">evidence recorded</text>
<path d="M32 220 H928" stroke="#626262" stroke-width="0.6"/>
<text x="32" y="250" fill="#262626" font-family="system-ui, sans-serif" font-size="14">Ready work may resolve or wait for a human; after the human step, recheck evidence.</text>
<text x="32" y="276" fill="#262626" font-family="system-ui, sans-serif" font-size="14">wontfix is set by the user or under the review-ticket exception.</text>
</svg>

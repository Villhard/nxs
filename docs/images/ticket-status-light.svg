  <title id="nxs-ticket-status-light-title">Ticket statuses and who sets them</title>
  <desc id="nxs-ticket-status-light-desc">rnd, bug and review write a ticket as ready-for-agent or needs-info; an answer turns needs-info into ready-for-agent; the /plan executor sets resolved or ready-for-human, and you set wontfix.</desc>

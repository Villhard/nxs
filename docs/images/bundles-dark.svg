<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="nxs-bundles-dark-title nxs-bundles-dark-desc">
<title id="nxs-bundles-dark-title">Bundles</title>
<desc id="nxs-bundles-dark-desc">The nxs-setup capability map identifies source routes while the retained dev-setup global route offers legacy companion bundles.</desc>
<defs><marker id="nxs-bundles-dark-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#909090"/></marker></defs>
<rect width="960" height="440" fill="#1c1c1c"/>
<text x="32" y="38" fill="#dadada" font-family="system-ui, sans-serif" font-size="23" font-weight="600">Capabilities and bundles</text>
<text x="32" y="62" fill="#909090" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Two setup routes have different installation boundaries.</text>
<path d="M253 160 H330" fill="none" stroke="#909090" stroke-width="1.5" marker-end="url(#nxs-bundles-dark-arrow)"/>
<path d="M253 302 H355" fill="none" stroke="#909090" stroke-width="1.5" marker-end="url(#nxs-bundles-dark-arrow)"/>
<rect x="32" y="126" width="221" height="68" rx="6" fill="#262626" stroke="#8dbbff" stroke-width="2"/>
<text x="46" y="152" fill="#dadada" font-family="ui-monospace, monospace" font-size="15" font-weight="600">nxs-setup</text>
<text x="46" y="175" fill="#909090" font-family="system-ui, sans-serif" font-size="13" font-weight="400">capability map</text>
<text x="355" y="134" fill="#909090" font-family="system-ui, sans-serif" font-size="14" font-weight="400">discussion</text>
<text x="512" y="134" fill="#dadada" font-family="ui-monospace, monospace" font-size="14" font-weight="600">→  rnd-grill</text>
<text x="355" y="161" fill="#909090" font-family="system-ui, sans-serif" font-size="14" font-weight="400">wayfinding</text>
<text x="512" y="161" fill="#dadada" font-family="ui-monospace, monospace" font-size="14" font-weight="600">→  rnd-map</text>
<text x="355" y="188" fill="#909090" font-family="system-ui, sans-serif" font-size="14" font-weight="400">feature work</text>
<text x="512" y="188" fill="#dadada" font-family="ui-monospace, monospace" font-size="14" font-weight="600">→  to-spec / to-tickets</text>
<text x="355" y="235" fill="#909090" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Map describes source coverage - not registration or automatic invocation.</text>
<rect x="32" y="268" width="221" height="68" rx="6" fill="#262626" stroke="#909090" stroke-width="1"/>
<text x="46" y="294" fill="#dadada" font-family="ui-monospace, monospace" font-size="15" font-weight="600">dev-setup global</text>
<text x="46" y="317" fill="#909090" font-family="system-ui, sans-serif" font-size="13" font-weight="400">retained legacy route</text>
<rect x="355" y="262" width="573" height="80" rx="6" fill="#262626" stroke="#909090" stroke-width="1"/>
<text x="369" y="288" fill="#dadada" font-family="ui-monospace, monospace" font-size="15" font-weight="600">companion bundles</text>
<text x="369" y="311" fill="#909090" font-family="system-ui, sans-serif" font-size="13" font-weight="400">Core  /  Wayfinding  /  Architecture  /  Sessions</text>
<path d="M32 368 H928" stroke="#909090" stroke-width="1"/>
<text x="32" y="397" fill="#dadada" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Legacy bundles are offered for selection; installation requires approval and verified upstream names.</text>
<text x="32" y="422" fill="#909090" font-family="system-ui, sans-serif" font-size="14" font-weight="400">nxs-setup does not offer, install or invoke companion skills.</text>
</svg>

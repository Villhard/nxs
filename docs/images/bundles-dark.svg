<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="nxs-bundles-dark-title nxs-bundles-dark-desc">
<title id="nxs-bundles-dark-title">Setup capability map</title>
<desc id="nxs-bundles-dark-desc">Independent nxs setup does not offer companion bundles. No companion installation is required by nxs-setup. dev-setup retains the legacy bundle offer until verified cutover.</desc>
<defs><marker id="nxs-bundles-dark-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#909090"/></marker></defs>
<rect width="960" height="340" fill="#1c1c1c"/>
<text x="32" y="42" fill="#dadada" font-family="system-ui, sans-serif" font-size="22" font-weight="600">Setup capability map</text>
<text x="32" y="68" fill="#909090" font-family="system-ui, sans-serif" font-size="14">Independent nxs setup does not offer companion bundles</text>
<path d="M 241 144 H 257" stroke="#909090" stroke-width="1.5" fill="none" marker-end="url(#nxs-bundles-dark-arrow)"/>
<path d="M 470 144 H 486" stroke="#909090" stroke-width="1.5" fill="none" marker-end="url(#nxs-bundles-dark-arrow)"/>
<path d="M 699 144 H 715" stroke="#909090" stroke-width="1.5" fill="none" marker-end="url(#nxs-bundles-dark-arrow)"/>
<rect x="32" y="104" width="209" height="80" rx="6" fill="#262626" stroke="#8dbbff"/>
<text x="44" y="134" fill="#dadada" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Choose goal</text>
<text x="44" y="158" fill="#909090" font-family="system-ui, sans-serif" font-size="12">nxs-setup</text>
<rect x="261" y="104" width="209" height="80" rx="6" fill="#262626" stroke="#909090"/>
<text x="273" y="134" fill="#dadada" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Audit</text>
<text x="273" y="158" fill="#909090" font-family="system-ui, sans-serif" font-size="12">existing configuration</text>
<rect x="490" y="104" width="209" height="80" rx="6" fill="#262626" stroke="#909090"/>
<text x="502" y="134" fill="#dadada" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Map capability</text>
<text x="502" y="158" fill="#909090" font-family="system-ui, sans-serif" font-size="12">nxs source routes</text>
<rect x="719" y="104" width="209" height="80" rx="6" fill="#262626" stroke="#909090"/>
<text x="731" y="134" fill="#dadada" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Approve package</text>
<text x="731" y="158" fill="#909090" font-family="system-ui, sans-serif" font-size="12">apply selected changes</text>
<path d="M32 220 H928" stroke="#909090" stroke-width="0.6"/>
<text x="32" y="250" fill="#dadada" font-family="system-ui, sans-serif" font-size="14">No companion installation is required by nxs-setup.</text>
<text x="32" y="276" fill="#dadada" font-family="system-ui, sans-serif" font-size="14">dev-setup retains the legacy bundle offer until verified cutover.</text>
</svg>

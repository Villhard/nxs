<text x="44" y="158" fill="#626262" font-family="system-ui, sans-serif" font-size="12">goal / project / global</text>
<rect x="215.2" y="104" width="163.2" height="80" rx="6" fill="#e4e4e4" stroke="#626262"/>
<text x="227.2" y="134" fill="#262626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Audit</text>
<text x="227.2" y="158" fill="#626262" font-family="system-ui, sans-serif" font-size="12">current state</text>
<rect x="398.4" y="104" width="163.2" height="80" rx="6" fill="#e4e4e4" stroke="#626262"/>
<text x="410.4" y="134" fill="#262626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Propose</text>
<text x="410.4" y="158" fill="#626262" font-family="system-ui, sans-serif" font-size="12">one change package</text>
<rect x="581.5999999999999" y="104" width="163.2" height="80" rx="6" fill="#e4e4e4" stroke="#626262"/>
<text x="593.5999999999999" y="134" fill="#262626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Approve</text>
<text x="593.5999999999999" y="158" fill="#626262" font-family="system-ui, sans-serif" font-size="12">user choice</text>
<rect x="764.8" y="104" width="163.2" height="80" rx="6" fill="#e4e4e4" stroke="#626262"/>
<text x="776.8" y="134" fill="#262626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Apply</text>
<text x="776.8" y="158" fill="#626262" font-family="system-ui, sans-serif" font-size="12">approved changes</text>
<path d="M32 220 H928" stroke="#626262" stroke-width="0.6"/>

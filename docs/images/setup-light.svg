<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="nxs-setup-light-title nxs-setup-light-desc">
<title id="nxs-setup-light-title">nxs-setup</title>
<desc id="nxs-setup-light-desc">Audit and approve a bounded setup package. Readiness is report-only and does not apply changes. Live setup, upgrade and native registration remain unverified.</desc>

<rect x="32" y="135" width="306" height="64" rx="9" fill="#e4e4e4" stroke="#d7d7d7"/><text x="48" y="162" class="heading">Idea or goal</text><text x="48" y="182" class="small">Decide what to build</text>
<rect x="362" y="135" width="306" height="64" rx="9" fill="#e4e4e4" stroke="#d7d7d7"/><text x="378" y="162" class="heading">Reported failure</text><text x="378" y="182" class="small">Find the cause</text>
<rect x="692" y="135" width="306" height="64" rx="9" fill="#e4e4e4" stroke="#d7d7d7"/><text x="708" y="162" class="heading">Existing changes</text><text x="708" y="182" class="small">Review what changed</text>
<rect x="1022" y="135" width="306" height="64" rx="9" fill="#e4e4e4" stroke="#d7d7d7"/><text x="1038" y="162" class="heading">Clear request</text><text x="1038" y="182" class="small">Implement entrusted work</text>
<rect x="32" y="245" width="306" height="64" rx="9" fill="#e4e4e4" stroke="#d7d7d7"/><text x="48" y="272" class="cmd">/rnd-grill</text><text x="48" y="292" class="small">Discuss choices and evidence</text>
<rect x="362" y="245" width="306" height="64" rx="9" fill="#e4e4e4" stroke="#d7d7d7"/><text x="378" y="272" class="cmd">/rnd-debug</text><text x="378" y="292" class="small">Investigate and classify</text>
<rect x="692" y="245" width="306" height="64" rx="9" fill="#e4e4e4" stroke="#d7d7d7"/><text x="708" y="272" class="cmd">/dev-review</text><text x="708" y="292" class="small">Verify and present findings</text>
<rect x="1022" y="245" width="306" height="64" rx="9" fill="#e4e4e4" stroke="#d7d7d7"/><text x="1038" y="272" class="cmd">/dev-exec</text><text x="1038" y="292" class="small">Plan, implement and check</text>
<rect x="32" y="355" width="306" height="64" rx="9" fill="#e4e4e4" stroke="#d7d7d7"/><text x="48" y="382" class="cmd">/to-decision</text><text x="48" y="402" class="small">Save approved conclusions</text>
<rect x="362" y="355" width="306" height="64" rx="9" fill="#e4e4e4" stroke="#d7d7d7"/><text x="378" y="382" class="heading">Confirmed cause</text><text x="378" y="402" class="small">Eligible for tickets</text>
<rect x="692" y="355" width="306" height="64" rx="9" fill="#e4e4e4" stroke="#d7d7d7"/><text x="708" y="382" class="heading">Verified findings</text><text x="708" y="402" class="small">User selects follow-up</text>
<rect x="1022" y="355" width="306" height="64" rx="9" fill="#e4e4e4" stroke="#d7d7d7"/><text x="1038" y="382" class="heading">Checked changes</text><text x="1038" y="402" class="small">Review can follow</text>

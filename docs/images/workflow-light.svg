<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="930" viewBox="0 0 1360 930" role="img" aria-labelledby="title desc">
<title id="title">nxs capability map</title><desc id="desc">Four starting points branch into investigation, review and execution. An approved feature spec, an eligible confirmed cause and selected review findings may converge at to-tickets. The ordinary review route can create selected tickets itself. Support commands apply across the map.</desc>
<rect width="1360" height="930" fill="#eeeeee"/>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#262626}.title{font-size:31px;font-weight:700;letter-spacing:-.5px}.subtitle{font-size:15px;fill:#626262}.label{font-size:12px;font-weight:700;letter-spacing:1px;fill:#626262}.heading{font-size:17px;font-weight:700}.small{font-size:13px;fill:#626262}.cmd{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:16px;font-weight:700;fill:#0061d2}.record{font-size:16px;font-weight:700;fill:#b73800}.arrow{fill:none;stroke:#626262;stroke-width:2;stroke-dasharray:5 5;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#626262" stroke-width="1.5"/></marker></defs>

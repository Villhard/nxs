  <title id="nxs-workflow-light-title">nxs workflow</title>
  <desc id="nxs-workflow-light-desc">dev-rnd, dev-bug or the mattpocock route write a ticket, the built-in /plan runs it, optional dev-review turns findings into new tickets, optional dev-spec records specs, and dev-commit commits.</desc>

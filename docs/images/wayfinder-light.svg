    <marker id="nxs-wayfinder-light-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7e7e7e"/></marker>
  </defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="nxs-wayfinder-light-title nxs-wayfinder-light-desc">
<title id="nxs-wayfinder-light-title">Decision map</title>
<desc id="nxs-wayfinder-light-desc">A map tracks decisions, not implementation authorization. Each small question requires permission; unknowns remain visible. A separately requested feature spec and tickets can follow when appropriate.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="nxs-wayfinder-light-title nxs-wayfinder-light-desc">
<title id="nxs-wayfinder-light-title">Mapping decisions toward a goal</title>
<desc id="nxs-wayfinder-light-desc">A map links decision questions and their blockers. Work on a frontier question requires permission; research and prototypes can provide evidence. Resolution does not authorize implementation.</desc>
<defs><marker id="nxs-wayfinder-light-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#626262"/></marker></defs>
<rect width="960" height="500" fill="#eeeeee"/>
<text x="32" y="39" fill="#262626" font-family="system-ui,sans-serif" font-size="22" font-weight="650">Mapping decisions toward a goal</text>
<text x="32" y="63" fill="#626262" font-family="system-ui,sans-serif" font-size="12">Each frontier question requires permission; links show dependencies and evidence.</text>
<path d="M222 137 H286" fill="none" stroke="#626262" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#nxs-wayfinder-light-arrow)"/>

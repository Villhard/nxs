<path d="M630 265 V187" fill="none" stroke="#626262" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#nxs-wayfinder-light-arrow)"/>
<path d="M725 146 H772" fill="none" stroke="#626262" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#nxs-wayfinder-light-arrow)"/>
<rect x="32" y="96" width="190" height="82" rx="6" fill="#e4e4e4" stroke="#0061d2" stroke-width="1.2"/>
<text x="46" y="115" fill="#0061d2" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">COMMAND</text>
<text x="46" y="138" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">/rnd-map</text>
<text x="46" y="157" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Goal, scope and</text>
<text x="46" y="173" fill="#262626" font-family="system-ui,sans-serif" font-size="11">linked questions</text>
<rect x="286" y="105" width="190" height="82" rx="6" fill="#e4e4e4" stroke="#b73800" stroke-width="1.2"/>
<text x="300" y="124" fill="#b73800" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">RECORD</text>
<text x="300" y="147" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">Question A</text>
<text x="300" y="166" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Frontier: no open blockers</text>
<rect x="286" y="265" width="190" height="82" rx="6" fill="#e4e4e4" stroke="#b73800" stroke-width="1.2"/>
<text x="300" y="284" fill="#b73800" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">RECORD</text>
<text x="300" y="307" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">Question B</text>
<text x="300" y="326" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Depends on question A</text>
<rect x="535" y="105" width="190" height="82" rx="6" fill="#e4e4e4" stroke="#b73800" stroke-width="1.2"/>
<text x="549" y="124" fill="#b73800" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">RECORD</text>
<text x="549" y="147" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">Question C</text>
<text x="549" y="166" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Depends on A and B</text>
<rect x="535" y="265" width="190" height="82" rx="6" fill="#e4e4e4" stroke="#626262" stroke-width="1.2"/>
<text x="549" y="284" fill="#626262" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">INPUT</text>
<text x="549" y="307" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">Evidence</text>
<text x="549" y="326" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Research or prototype</text>
<text x="549" y="342" fill="#262626" font-family="system-ui,sans-serif" font-size="11">when authorized</text>
<rect x="772" y="105" width="156" height="82" rx="6" fill="#e4e4e4" stroke="#626262" stroke-width="1.2"/>
<text x="786" y="124" fill="#626262" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">OUTCOME</text>
<text x="786" y="147" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">Resolve</text>
<text x="786" y="166" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Answer and recompute</text>
<text x="786" y="182" fill="#262626" font-family="system-ui,sans-serif" font-size="11">the frontier</text>
<rect x="772" y="295" width="156" height="90" rx="6" fill="#e4e4e4" stroke="#626262" stroke-width="1.2"/>
<text x="786" y="314" fill="#626262" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">OUTCOME</text>
<text x="786" y="337" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">Implementation</text>
<text x="786" y="356" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Separate scope;</text>
<text x="786" y="372" fill="#262626" font-family="system-ui,sans-serif" font-size="11">map is not a ticket</text>
</svg>

  <title id="nxs-wayfinder-light-title">Work bigger than one session: wayfinder</title>
  <desc id="nxs-wayfinder-light-desc">The first wayfinder session names the destination and writes the map and decision tickets, each later session resolves one ticket and updates the map; once the way is clear, to-spec and to-tickets write a feature for /plan.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="nxs-artifacts-light-title nxs-artifacts-light-desc">
<title id="nxs-artifacts-light-title">Artifacts and ownership</title>
<desc id="nxs-artifacts-light-desc">Task records and durable project intent serve different purposes. dev-spec records built intent in SPEC.md or private .SPEC.md. Glossary and ADRs hold domain terms and decisions. Existing paths take precedence.</desc>

<text x="46" y="142" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">Investigation</text>
<text x="46" y="161" fill="#262626" font-family="system-ui,sans-serif" font-size="11">rnd-grill, rnd-debug,</text>
<text x="46" y="177" fill="#262626" font-family="system-ui,sans-serif" font-size="11">rnd-research, rnd-map</text>

<text x="644" y="311" fill="#262626" font-family="system-ui,sans-serif" font-size="11">SPEC.md / .SPEC.md</text>
<text x="644" y="327" fill="#262626" font-family="system-ui,sans-serif" font-size="11">durable intent from built work</text>
<rect x="630" y="385" width="295" height="72" rx="6" fill="#e4e4e4" stroke="#0061d2" stroke-width="1.2"/>

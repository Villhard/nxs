<text x="46" y="254" fill="#0061d2" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">COMMAND</text>
<text x="46" y="277" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">Artifact commands</text>
<text x="46" y="296" fill="#262626" font-family="system-ui,sans-serif" font-size="11">to-decision, to-spec,</text>
<text x="46" y="312" fill="#262626" font-family="system-ui,sans-serif" font-size="11">to-tickets, to-handoff</text>

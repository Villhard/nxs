<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="artifacts-light-title artifacts-light-desc">
<title id="artifacts-light-title">У каждого документа свой владелец</title>
<desc id="artifacts-light-desc">rnd-grill сохраняет подготовку и доменные записи, rnd-debug диагноз, dev-exec необязательные tickets и контекст, dev-review отчет, dev-spec существенные контракты построенного; общей обязательной цепочки нет.</desc>
<style>text{font-family:'Geist',system-ui,sans-serif;fill:#262626}.title{font-family:'Instrument Serif',Georgia,serif;font-size:28px}.name{font-family:'Geist Mono',ui-monospace,monospace;font-size:16px;font-weight:600}.heading{font-size:16px;font-weight:600}.sub{font-size:13px;fill:#626262}.node{fill:#eeeeee;stroke:#626262;stroke-width:1.2}.rule{stroke:#d7d7d7}</style>
<rect width="960" height="600" fill="#eeeeee"/>
<text class="title" x="40" y="48">Сохраняй только нужные документы</text>
<text class="sub" x="40" y="76">Это владельцы, не цепочка. Предпочитай установленные пути; по умолчанию .scratch/&lt;feature&gt;/.</text>
<rect class="node" x="40" y="100" width="880" height="80" rx="6"/><path class="rule" d="M304 100 V180"/>
<text class="name" x="60" y="132">rnd-grill</text><text class="sub" x="60" y="156">Сохранение по согласованию</text>
<text class="heading" x="328" y="132">Решения, описания функций, факты и вопросы</text><text class="sub" x="328" y="156">Глоссарий согласуется отдельно; вопросы не отправляются.</text>
<rect class="node" x="40" y="188" width="880" height="80" rx="6"/><path class="rule" d="M304 188 V268"/>
<text class="name" x="60" y="220">rnd-debug</text><text class="sub" x="60" y="244">Диагноз, не исправление</text>
<text class="heading" x="328" y="220">Доказательства причины</text><text class="sub" x="328" y="244">Подтвержденные причина/класс либо точный пробел и следующая проба.</text>
<rect class="node" x="40" y="276" width="880" height="80" rx="6"/><path class="rule" d="M304 276 V356"/>
<text class="name" x="60" y="308">dev-exec</text><text class="sub" x="60" y="332">При пользе / по запросу</text>
<text class="heading" x="328" y="308">Необязательные tickets и контекст</text><text class="sub" x="328" y="332">Реальные предпосылки, прежние IDs/история, проверки и Git.</text>
<rect class="node" x="40" y="364" width="880" height="80" rx="6"/><path class="rule" d="M304 364 V444"/>
<text class="name" x="60" y="396">dev-review</text><text class="sub" x="60" y="420">Пишет только отчет</text>
<text class="heading" x="328" y="396">Отчет проверки</text><text class="sub" x="328" y="420">Охват, источники, вердикты и факты; выбранным правкам ticket не нужен.</text>
<rect class="node" x="40" y="452" width="880" height="80" rx="6"/><path class="rule" d="M304 452 V532"/>
<text class="name" x="60" y="484">dev-spec</text><text class="sub" x="60" y="508">Существенное из результата</text>
<text class="heading" x="328" y="484">Проектный SPEC.md / частный .SPEC.md</text><text class="sub" x="328" y="508">Единственный обычный автор; feature spec.md - подготовка, не реализация.</text>
<text class="sub" x="40" y="568">Малой задаче файлы не нужны. Запись не запускает следующий скилл и не дает новых полномочий.</text>
<text class="sub" x="40" y="592">Сохраняй прежние tickets, журналы, решения и прототипы; не мигрируй и не удаляй их без разрешения.</text>
</svg>

<text x="644" y="427" fill="#262626" font-family="system-ui,sans-serif" font-size="15" font-weight="650">/dev-spec</text>
<text x="644" y="446" fill="#262626" font-family="system-ui,sans-serif" font-size="11">Only writer of project specs</text>

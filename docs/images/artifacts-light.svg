<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="nxs-artifacts-light-title nxs-artifacts-light-desc">
<title id="nxs-artifacts-light-title">Commands and their records</title>
<desc id="nxs-artifacts-light-desc">Commands create or use feature records and project records. Existing paths take precedence. Project specs record built intent and dev-spec is their only writer.</desc>
<defs><marker id="nxs-artifacts-light-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#626262"/></marker></defs>
<rect width="960" height="500" fill="#eeeeee"/>
<text x="32" y="39" fill="#262626" font-family="system-ui,sans-serif" font-size="22" font-weight="650">Commands and their records</text>
<text x="32" y="63" fill="#626262" font-family="system-ui,sans-serif" font-size="12">Records retain evidence and history; their existence does not start another command.</text>

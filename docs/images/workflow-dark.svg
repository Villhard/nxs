<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 1120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nxs-workflow-dark-title nxs-workflow-dark-desc" id="nxs-workflow-dark-root">
  <title id="nxs-workflow-dark-title">Delegated and manual nxs workflows</title>
  <desc id="nxs-workflow-dark-desc">Within a client that exposes native subagents, dev-lead coordinates user-approved scope and lead-approved ticket plans, checkpoints accepted work before each next independent ticket and finishes with complete-feature review; the separate manual route retains standalone skills and optional companion preparation outside lead automation.</desc>
  <defs>
    <marker id="nxs-workflow-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#909090"/></marker>
    <marker id="nxs-workflow-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ffa083"/></marker>
    <marker id="nxs-workflow-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8dbbff"/></marker>
    <marker id="nxs-workflow-dark-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#909090"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#1c1c1c"/>
  <text x="32" y="36" fill="#dadada" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">DELEGATED: /dev-lead VIA NATIVE SUBAGENTS</text>
  <text x="32" y="62" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif">No native subagent tool: stop with the missing capability; no partial coordination.</text>

  <rect x="48" y="88" width="264" height="88" rx="6" fill="#262626" stroke="#909090" stroke-width="1"/>
  <text x="180" y="114" fill="#dadada" font-size="13" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Native subagent tool</text>
  <text x="180" y="134" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">fresh context / complete packet</text>
  <text x="180" y="150" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">completion wait / result</text>
  <rect x="348" y="88" width="264" height="88" rx="6" fill="#262626" stroke="#909090" stroke-width="1"/>
  <text x="480" y="114" fill="#dadada" font-size="13" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">User approves feature plan</text>
  <text x="480" y="134" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">scope / permissions / checks</text>
  <text x="480" y="150" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">new behavior returns to user</text>
  <rect x="648" y="88" width="264" height="88" rx="6" fill="#262626" stroke="#909090" stroke-width="1"/>
  <text x="780" y="114" fill="#dadada" font-size="13" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Lead approves ticket plan</text>
  <text x="780" y="134" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">one writing subagent</text>
  <text x="780" y="150" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">lead independently accepts work</text>
  <rect x="648" y="244" width="264" height="88" rx="6" fill="#262626" stroke="#909090" stroke-width="1"/>
  <text x="780" y="270" fill="#dadada" font-size="13" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Per-ticket checkpoint</text>
  <text x="780" y="290" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">full checks / review / fixes</text>
  <text x="780" y="306" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">dev-spec / atomic dev-commit</text>
  <text x="780" y="322" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">verify resulting HEAD</text>
  <rect x="348" y="244" width="264" height="88" rx="6" fill="#262626" stroke="#909090" stroke-width="1"/>
  <text x="480" y="270" fill="#dadada" font-size="13" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Next independent ticket</text>
  <text x="480" y="290" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">only after verified checkpoint</text>
  <text x="480" y="306" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">planning has no empty commits</text>
  <rect x="48" y="244" width="264" height="88" rx="6" fill="#262626" stroke="#909090" stroke-width="1"/>
  <text x="180" y="270" fill="#dadada" font-size="13" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Complete-feature review</text>
  <text x="180" y="290" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">committed + remaining work</text>
  <text x="180" y="306" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">final checks / specs / commits</text>
  <text x="32" y="428" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif">While lead is active: status.md, decision.log and run/question records; submitted answers continue the work.</text>
  <text x="32" y="450" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif">Close or release subagent sessions only through the host; native evidence survives.</text>
  <text x="32" y="472" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif">Unanswered, invalid or uncertain results stay protected; recovery reconciles effects before retry.</text>
  <text x="32" y="494" fill="#909090" font-size="11" font-family="'Geist', system-ui, sans-serif">Writing executors never commit. Review, specs and atomic commits remain lead-controlled stages.</text>
  <line x1="32" y1="524" x2="928" y2="524" stroke="#909090" stroke-width="0.8"/>
  <text x="32" y="556" fill="#dadada" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">MANUAL: INDEPENDENT SKILLS; MP COMPANIONS OUTSIDE LEAD AUTOMATION</text>

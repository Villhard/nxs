name: CI

on:
  push:
  pull_request:

jobs:
  # Keep the check name required by main branch protection.
  marketplace:
    name: House style + frontmatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: House-style lint
        run: bash .github/scripts/lint-house-style.sh

      - name: Check the skills tree
        run: bash .github/scripts/check-skills.sh

      - name: Run checker regressions (Python 3 standard library)
        run: python3 .github/scripts/test_check_skills.py

      - name: Run sequential lead regressions (Python 3 standard library)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  discovery:
    name: Skills CLI discovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: The skills CLI lists all seven skills
        run: |
          listed=$(npx -y skills@latest add . -l)
          echo "$listed"
          for skill in dev-rnd dev-bug dev-review dev-spec dev-setup dev-commit dev-lead; do
            echo "$listed" | grep -q "$skill" || { echo "missing skill: $skill"; exit 1; }
          done

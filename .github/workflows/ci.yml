name: CI

on:
  push:
  pull_request:

jobs:
  # Keep the check name required by main branch protection.
  marketplace:
    name: House style + frontmatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: House-style lint
        run: bash .github/scripts/lint-house-style.sh

      - name: Check the skills tree
        run: bash .github/scripts/check-skills.sh

      - name: Reject runtime and Python remnants
        run: bash .github/scripts/check-no-runtime.sh

  discovery:
    name: Skills CLI discovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: The skills CLI lists the source catalog
        run: |
          listed=$(npx -y skills@latest add . -l)
          echo "$listed"
          listed=$(printf '%s\n' "$listed" | sed -E $'s/\033\\[[0-9;]*[mK]//g')
          for skill in rnd-grill to-decision to-spec to-tickets dev-exec rnd-debug dev-review dev-spec dev-commit rnd-research rnd-prototype rnd-design rnd-audit rnd-map to-questionnaire to-handoff nxs-retro nxs-lead nxs-setup; do
            echo "$listed" | grep -E -q "(^|[^[:alnum:]-])${skill}([^[:alnum:]-]|$)" || { echo "missing skill: $skill"; exit 1; }
          done

name: CI

on:
  push:
  pull_request:

jobs:
  # Keep the check name required by main branch protection.
  marketplace:
    name: House style + frontmatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: House-style lint
        run: bash .github/scripts/lint-house-style.sh

      - name: Check the skills tree
        run: bash .github/scripts/check-skills.sh

      - name: Reject runtime and Python remnants
        run: bash .github/scripts/check-no-runtime.sh

  discovery:
    name: Skills CLI discovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: The skills CLI lists the source catalog
        run: |
          set -euo pipefail
          # This job independently rejects missing, extra and nested commands.
          bash .github/scripts/check-skills.sh
          expected=$(printf '%s\n' rnd-grill rnd-debug dev-exec dev-review dev-spec dev-commit nxs-setup | sort)
          listed=$(npx -y skills@latest add . -l)
          printf '%s\n' "$listed"
          listed=$(printf '%s\n' "$listed" | sed -E $'s/\033\\[[0-9;]*[mK]//g')
          # Parse only list entries, not names mentioned in descriptions or logs.
          # The count and complete block are both required; format drift fails closed.
          [ "$(printf '%s\n' "$listed" | grep -Ec '(^|[^[:alnum:]])Found 7 skills([^[:alnum:]]|$)')" -eq 1 ] || {
            echo 'discovery: expected exactly seven source commands'
            exit 1
          }
          actual=$(printf '%s\n' "$listed" | awk '
            /Available Skills/ { if (started++) exit 1; inside = 1; next }
            inside && /Use --skill .* to install specific skills/ { finished = 1; inside = 0; next }
            inside {
              line = $0
              sub(/^[^[:alnum:]]*/, "", line)
              sub(/[[:space:]]*$/, "", line)
              if (line ~ /^[a-z][a-z0-9-]*$/) print line
            }
            END { if (started != 1 || !finished) exit 1 }
          ' | sort)
          [ "$actual" = "$expected" ] || {
            printf 'discovery: expected catalog:\n%s\nactual catalog:\n%s\n' "$expected" "$actual"
            exit 1
          }
